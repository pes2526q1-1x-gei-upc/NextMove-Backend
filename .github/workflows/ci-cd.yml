name: CI + Deploy Backend

on:
  push:
    branches:
      - main
      - dev
      - release/*
      - 'feature-*/**'
      - 'hotfix/*'
      - 'fix/*'
  pull_request:
    branches:
      - dev
      - 'feature-*/**'
      - 'release/*'
      - 'hotfix/*'
      - 'fix/*'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js environment
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint linter and generate report
        run: npx eslint . -f checkstyle -o eslint-report.xml

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.xml

      - name: Run tests with report
        run: |
          mkdir -p test-reports
          npm test -- --reporters=default --reporters=jest-junit
        env:
          CI: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: test-reports/junit.xml

  deploy:
    needs: lint-and-test
    if: |
      needs.lint-and-test.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Definir servicio según rama
        id: vars
        run: |
          BRANCH="${GITHUB_REF##*/}"
          if [ "$BRANCH" == "main" ]; then
            echo "servicio=pro-backend" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == release/* ]]; then
            echo "servicio=pre-backend" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" == "dev" ]; then
            echo "servicio=test-backend" >> $GITHUB_OUTPUT
          else
            echo "servicio=none" >> $GITHUB_OUTPUT
          fi

      - name: Desplegar servicio en EC2
        if: steps.vars.outputs.servicio != 'none'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            cd /home/ubuntu/BeMotion
            # Aseguramos que la variable SERVICIO tiene el valor correcto desde el paso anterior
            SERVICIO=${{ steps.vars.outputs.servicio }}

            # 1. Limpieza (Añadimos '|| true' para que no falle si es el primer despliegue y no hay nada que borrar)
            sudo docker stop \$SERVICIO || true
            sudo docker rm \$SERVICIO || true
            
            # 2. Construcción: Creamos la imagen nueva con el código actualizado
            sudo docker-compose build --no-cache \$SERVICIO
            
            # 3. Migración de base de datos (igual que antes, pero asegurando que si falla, falla el deploy)
            echo "Ejecutando migraciones en base de datos..."
            set -e  # opcional: hace que el script SSH falle si cualquier comando falla
            sudo docker-compose run --rm $SERVICIO npm run migrate:up

            # 4. Despliegue
            sudo docker-compose up -d $SERVICIO

            # 5. Logs rápidos para debug (opcional, muy útil al principio)
            sudo docker-compose ps
            sudo docker-compose logs -n 50 $SERVICIO

          EOF
