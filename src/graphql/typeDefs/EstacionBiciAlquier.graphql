#Definimos la estructura de una estación de bicis

type EstacionDeBici {
    station_id: ID!
    name: String
    address: String
    capacity: Int
    lat: Float
    lon: Float
    num_bikes_available: Int
    num_docks_available: Int
    last_reported: Int
}

# Añade las nuevas consultas para las estaciones dentro de Query

type Query {
    estacionesDeBici: [EstacionDeBici] #retorna un array de estaciones. 
    estacionDeBici(id: ID!): EstacionDeBici
}