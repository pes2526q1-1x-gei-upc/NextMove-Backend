

"""
Enumeración que define los posibles estados operativos de una estación de Bicing.
Representa si la estación está funcionando completamente o tiene restricciones.
"""
enum EstadoEstacion {
    OPERATIVA   #Estación completamente operativa: se pueden alquilar y anclar bicis
    SOLO_ANCLAJE
    SOLO_ALQUILER
    FUERA_DE_SERVICIO   #Estación temporalmente cerrada por mantenimiento o avería
 
}

"""
Tipo principal que representa una estación de Bicing.
Contiene tanto información estática como dinámica.
En GraphQL no hay herencia, por lo que todos los atributos se definen en el mismo tipo.
"""
type EstacionBicing {
    #Atributos Estáticos
    
    id: ID!
    nombre: String!
    direccion: String!
    coordenadas: Coordinates! #Tipo compartido definido en base.graphql
    plazasTotales: Int! "capacity"
    estacionCargaElectrica: Boolean!

    #Atributos dinámicos

    sePuedenAlquilarBicis: Boolean
    sePuedeAnclarBicis: Boolean

    plazasOcupadas: Int
    anclajesDisponibles: Int
    estado: EstadoEstacion

    #podemos desglosarlo: 

    bicisMecanicasDisponibles: Int
    bicisElectricasDisponibles: Int

    """
    Distancia en kilómetros es un valor de retorno que solo aparece en ciertas queries donde queramos computar
    la distancia desde un punto hasta una estación. En el resto de casos será null. 
    """
    distanciaKm: Float

}

input CreateInputEstacionBicing {
    id: ID!
    nombre: String!
    direccion: String!
    coordenadas: CoordinatesInput! #Tipo compartido definido en base.graphql
    plazasTotales: Int! 
    estacionCargaElectrica: Boolean!
}

"""
En este caso  los campos no son obligatorios porque puede ser únicamente una actualización parcial de la estación. 
"""
input updateEstacionInput {
  nombre: String
  direccion: String
  coordenadas: CoordinatesInput
  plazasTotales: Int
  estacionCargaElectrica: Boolean
}


type Query {
    """
    Obtiene la lista completa de todas las estaciones de Bicing.
    Retorna un array no nulo con elementos no nulos (siempre habrá al menos un array vacío).
    """
    getEstacionesDeBicing: [EstacionBicing!]!, 

      """
    Obtiene una estación específica por su ID.
    Retorna null si no se encuentra la estación.
    
    Ejemplo de uso:
    query {
      getEstacionDeBicing(id: "123") {
        nombre
        bicisMecanicasDisponibles
      }
    }
    """
    getEstacionDeBicing(id: ID!): EstacionBicing
    
    """
    Busca estaciones cercanas a una ubicación geográfica específica.
    Las estaciones retornadas incluyen el campo distanciaKm calculado.
    
    Ejemplo de uso:
    query {
      getEstacionesDeBicingCercanas(location: {
        coordinates: { latitude: 41.3851, longitude: 2.1734 }
        radiusKm: 2
      }) {
        nombre
        distanciaKm
        anclajesDisponibles
      }
    }
    """
    getEstacionesDeBicingCercanas(location: LocationInput!): [EstacionBicing!]!

   """ 
   Busca estaciones de bicing que coincidan con una dirección dada como parámetro de entrada. 

   Ejemplo de uso:

   query buscaPorDir {
    getEstacionesDeBicingPorDireccion(address:"PORTAL DE SANTA MADRONA, 2-4") {
      id
      nombre
      direccion
      coordenadas {
        latitude
        longitude
      }
      plazasTotales
      estacionCargaElectrica
      sePuedenAlquilarBicis
      sePuedeAnclarBicis
      plazasOcupadas
      anclajesDisponibles
      estado
      bicisMecanicasDisponibles
      bicisElectricasDisponibles
    }
}
   """

    getEstacionesDeBicingPorDireccion(address: String!): [EstacionBicing!]!
}

type Mutation {
  createEstacionDeBicing(dataEstacion: CreateInputEstacionBicing!): EstacionBicing!

  updateEstacionDeBicing(id: ID!, dataEstacion: updateEstacionInput!): EstacionBicing!

  deleteEstacionDeBicing(id: ID!): Boolean!
}