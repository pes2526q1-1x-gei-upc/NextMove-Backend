

type trophy {
  name: String!
}

type Company{
    name: String!
    email: String
    url: String
    description: String
    logo_url: String
    location: Coordinates
}

type Challenge{
    id: String!
    name: String!
    distance: Int!
    description: String!
    points: Int!
    starting_date: String!
    ending_date: String!
    photo: String
    company: Company
}

extend type Query{
    getAllChallenges: [Challenge]!
    getEnrolledChallenges: [Challenge]!
    getTrophies: [trophy]!
    getPromotedCompanies: [Company]!
}

extend type Mutation{
    enrollChallenge(challenge_id: String!): Boolean!
}