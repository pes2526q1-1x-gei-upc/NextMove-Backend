type Station {
  id: ID!
  name: String!
  address: String
  city: String
  coordinates: Coordinates!
  
  # Available connectors
  connectors: [Connector!]!

  # Metadata
  accessType: String
  isSuperFast: Boolean
  lastUpdated: String
  
  # Optional distance field for nearby queries
  distance: Float
}

type Connector {
  type: ConnectorType!
  powerKw: Float!
  status: ConnectorStatus!
  statusCode: String!
}


enum ConnectorType {
  CCS      
  CHADEMO  
  MENNEKES 
  SCHUKO   
}

enum ConnectorStatus {
  AVAILABLE    
  OCCUPIED     
  UNAVAILABLE  
}

type StationsResponse {
  stations: [Station!]!
  total: Int!
}

input LocationInput {
  coordinates: CoordinatesInput!
  radiusKm: Float
}

input BoundsInput {
  north: Float!
  south: Float!
  east: Float!
  west: Float!
}

extend type Query {
  stations: StationsResponse!
  station(id: ID!): Station
  nearbyStations(location: LocationInput!): [Station!]!
  stationsInBounds(bounds: BoundsInput!): [Station!]!
  stationsByCity(city: String!): [Station!]!
}