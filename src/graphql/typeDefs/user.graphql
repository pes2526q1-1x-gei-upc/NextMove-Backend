enum Mode {
  CAR
  BIKE
}

type User {
  email: String!
  name: String!
  photo: String
  birthDate: String
  phoneNumber: String
  preferredMode: Mode!
  bioDescription: String
  createdAt: String
}

input CreateUserInput {
  email: String!
  name: String!
  preferredMode: Mode!
}

input UserUpdateInput {
  preferredMode: Mode
  photo: String
  birthDate: String
  phoneNumber: String
  bioDescription: String
}

extend type Query {
  User(email: String!): User
  Users: [User!]!
}

extend type Mutation {
  createUser(name: String!, email: String!, preferredMode: Mode!): User!
  updateUser(email: String!, name: String, preferredMode: Mode): User!
  deleteUser(email: String!): Boolean!
  updateMe(email: String, name: String, preferredMode: Mode): User
  deleteMe(email: String): Boolean!
}
