enum Mode {
  CAR,
  BIKE
}


"""
  It is assumed that user is identified by email and that
  when creating an user a username (name field) and preferred mode must be provided.
"""
type User {
  email: String!
  name: String!
  photo: String
  birthDate: String
  phoneNumber: String
  preferredMode: Mode!
  bioDescription: String
  createdAt: String 
}

input CreateUserInput {
  email: String!
  name: String!
  preferredMode: Mode!
}

"""
  The data inside this Input should also have the old data apart from the new data.
  That is because a null value in a field means that user "erased" that data from his profile.
  e.g: We have -> 
  {
    bioDescription: "FIB - UPC"
    phoneNumber: 123
    (rest ...)
  }
  And wants to update the phone number then, Input should be: 
  { 
    bioDescription: "FIB - UPC" -> user old data
    phoneNumber: 666 -> user new number
    (rest of old data...)
  }
"""
input UserUpdateInput {
  preferredMode: Mode
  photo: String
  birthDate: String
  phoneNumber: String
  bioDescription: String
}

extend type Query {
  """ 
    me() gets the current user his profile information.
    Valid authorization token in the request header ("Authorization": Bearer <token>) must be provided,
    else returns null.
  """
  me: User
  User(email: String!): User
  Users: [User!]! 
}

extend type Mutation {
  """
    Creates a new instance of user with given input and returns the user created
  """
  createUser(input: CreateUserInput!): User!
  """
    Updates the current user data with given input (check input specs above)
  """
  updateMe(changingData: UserUpdateInput!): User
  """
    Deletes the current user account, true if okay else false.
  """
  deleteMe: Boolean!
}
