"""
Enumeración de los modos de transporte preferidos por el usuario.
"""
enum Mode {
  CAR
  BIKE
}

"""
Representa un usuario registrado en el sistema.
Contiene información de perfil y preferencias de transporte.
"""
type User {
  id: String!
  email: String!
  name: String
  nickname: String!
  photo: String
  birth_date: String
  phone_number: String
  preferred_mode: String
  preferred_language: String
  bio_description: String
  created_at: String
  needsToRegister: Boolean
}

"""
Input para crear un nuevo usuario.
"""
input CreateUserInput {
  email: String!
  name: String
  preferredMode: Mode
}

"""
Input para actualizar información del usuario.
Todos los campos son opcionales.
"""
input UserUpdateInput {
  name: String
  nickname: String
  phoneNumber: String
  bioDescription: String
  preferredMode: Mode
  preferredLanguage: String
  birthDate: String
  photo: String
  needsToRegister: Boolean
}

extend type Query {
  """
  Obtiene los datos del usuario de la sesión actual.
  Requiere token en header: Authorization: Bearer <token>
  """
  me: User

  """
  Obtiene un usuario por email.
  """
  User(email: String!): User

  """
  Lista todos los usuarios.
  """
  Users: [User!]!
}

extend type Mutation {
  """
  Actualiza los datos del usuario autenticado.
  Usa email del token, o pásalo explícitamente.
  """
  updateMe(
    id: String!
    email: String!
    name: String
    nickname: String!
    phoneNumber: String
    bioDescription: String
    preferredMode: Mode
    preferredLanguage: String
    birthDate: String
    photo: String
    needsToRegister: Boolean
  ): User!

  """
  Actualiza cualquier usuario (admin).
  """
  updateUser(email: String!, name: String): User!

  """
  Crea un nuevo usuario.
  """
  createUser(email: String!, name: String, preferredMode: Mode): User!

  """
  Elimina un usuario.
  """
  deleteUser(email: String!): Boolean!

  """
  Elimina tu cuenta.
  """
  deleteMe: Boolean!
}