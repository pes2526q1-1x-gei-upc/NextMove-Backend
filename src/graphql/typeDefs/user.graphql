"""
Enumeración de los modos de transporte preferidos por el usuario.
"""
enum Mode {
  CAR
  BIKE
}

"""
Representa un usuario registrado en el sistema.
Contiene información de perfil y preferencias de transporte.
"""
type User {
  email: String!
  name: String
  nickname: String
  photo: String
  birthDate: String
  phoneNumber: String
  preferredMode: Mode
  preferredLanguage: String
  bioDescription: String
  createdAt: String
}

"""
Input para crear un nuevo usuario.
Contiene los campos mínimos necesarios para el registro -> email, nombre y un modo preferido
"""
input CreateUserInput {
  email: String!
}

"""
Input para actualizar información del usuario.
Todos los campos son opcionales, solo se actualizan los proporcionados.
Por ejemplo supón que un usuario inicialmente tiene estos datos ->
preferredMode: CAR,
photo: null
phoneNumber: 123
birthDate: 1/2/3
bio: hola

Si queremos actualizar su numero por 456 y quitar su bio (vacío) el Input entero será: 
preferredMode: CAR
photo: null
birthDate: 1/2/3
phoneNumber: 456 -> cambio
birthDate: 1/2/3
bio: null -> cambio

Fíjate que la información antigua debes ponerlo igualmente en el input y no puedes dejarlo como null.
Ya que en este contexto null significa que queremos quitar información de ese campo. 
"""
input UserUpdateInput {
  preferredMode: Mode
  photo: String
  phoneNumber: String
  bioDescription: String
}

extend type Query {

  """
    Obtiene los datos del usuario de la sesión actual identificado por el token en el header de la request. 
    Debe tener un token válido OBLIGATORIAMENTE, si no, no os funcionará la query.
    El header debe tener esta forma (se puede setear en el playground también).
    {
      "Authorization": "Bearer <tokenSesionFirebase>"
    }
  """
  me: User

  """
  Obtiene un usuario específico por su email.
  Retorna null si el usuario no existe.

  NO ES LO MISMO QUE 'me', no intentéis haceros el listo y hacer un refactor para reutilizar codigo por donde no se puede.
  La query User permite a cualquier usuario obtener datos de otro usuario concreto mediante su email, en cambio, me solo te devuelve los datos del usuario de la sesión actual.
  Es decir tienen responsabilidades y própositos diferentes, no mezclemos cosas, aunque "lógicamente" o "matemáticamente" se pueda reutilizar código (ya que me es un subconjunto de User).
  
  Ejemplo:
  query {
    User(email: "usuario@ejemplo.com") {
      name
      preferredMode
    }
  }
  """
  User(email: String!): User
  
  """
  Obtiene la lista completa de todos los usuarios registrados.
  Fíjate que no tiene ningun parámetro de entrada, porque internamente
  lo que hace es validar el token que está en el header de la petición.
  """
  Users: [User!]!
} 

extend type Mutation {

  """
  Un usuario autenticado (con token en el header), puede actualizar sus datos mediante esta operación
  retorna los mismos datos nuevos si salió bien, null en caso contrario. Nota: el campo email no se puede actualizar (de momento)
  """
  updateMe(email: String, name: String, preferredMode: Mode, phoneNumber: String, bioDescription: String): User

  """
  No implementado o implementado pero no testeado
  """
  updateUser(email: String!, name: String): User!  
  createUser(name: String!, email: String!, preferredMode: Mode!): User!
  deleteUser(email: String!): Boolean!
  deleteMe(email: String): Boolean!
}
